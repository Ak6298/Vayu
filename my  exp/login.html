<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e2e8f0;
      }
      .card {
        width: min(90vw, 420px);
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 18px;
        padding: 30px 24px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
      }
      h2 {
        margin-top: 0;
        text-align: center;
        letter-spacing: 1px;
      }
      label {
        display: block;
        margin: 16px 0 8px;
        font-size: 0.95rem;
        color: #cbd5e1;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #475569;
        background: #0f172a;
        color: #f8fafc;
        font-size: 1rem;
      }
      button {
        width: 100%;
        margin-top: 18px;
        background: #38bdf8;
        color: #082f49;
        border: none;
        border-radius: 10px;
        padding: 12px 14px;
        font-weight: bold;
        cursor: pointer;
      }
      .message {
        margin-top: 18px;
        min-height: 22px;
        font-size: 0.95rem;
      }
      .success { color: #86efac; }
      .error { color: #fca5a5; }
      .link {
        text-align: center;
        margin-top: 18px;
        font-size: 0.92rem;
      }
      .link a {
        color: #7dd3fc;
        text-decoration: none;
      }
      .user-details {
        margin-top: 20px;
        padding: 14px;
        border: 1px solid rgba(125, 211, 252, 0.4);
        border-radius: 10px;
        background: rgba(14, 116, 144, 0.12);
        display: none;
      }
      .user-details strong { display: block; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Enter your email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" required />

        <button type="submit">Login</button>
      </form>

      <div id="message" class="message"></div>

      <div id="userDetails" class="user-details"></div>

      <div class="link">
        New here? <a href="/register">Create account</a>
      </div>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const messageBox = document.getElementById('message');
      const userDetails = document.getElementById('userDetails');

      async function safeJsonRequest(url, options = {}) {
        const response = await fetch(url, options);
        const contentType = response.headers.get('content-type') || '';

        if (!contentType.includes('application/json')) {
          const text = await response.text();
          throw new Error(text || 'Server returned an invalid response.');
        }

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || 'Request failed.');
        }

        return result;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const submitButton = form.querySelector('button[type="submit"]');

        if (!email || !password) {
          messageBox.textContent = 'Please enter both email and password.';
          messageBox.className = 'message error';
          return;
        }

        submitButton.disabled = true;
        messageBox.textContent = 'Logging in...';
        messageBox.className = 'message';
        userDetails.style.display = 'none';

        try {
          const result = await safeJsonRequest('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const user = result.user;
          messageBox.textContent = result.message;
          messageBox.classList.add('success');

          userDetails.innerHTML = `
            <strong>Registered user details</strong>
            <div><b>Name:</b> ${user.name}</div>
            <div><b>Phone no.:</b> ${user.phone}</div>
            <div><b>Email:</b> ${user.email}</div>
          `;
          userDetails.style.display = 'block';
          form.reset();
        } catch (error) {
          messageBox.textContent = error.message || 'Something went wrong while logging in.';
          messageBox.classList.add('error');
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
