<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - VAYU BRAHMAN</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="navbar">

        <div class="logo">
            VAYU BRAHMAN
        </div>

        {% if user.is_authenticated %}
            <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="logout-btn">Login</a>
        {% endif %}

    </nav>


    <main class="home-page">

        <h1>Welcome to VAYU BRAHMAN</h1>

        <p>
            Your journey starts here.
        </p>

        {% if guest_mode %}
            <p class="guest-note">You are browsing as a guest.</p>
        {% else %}
            <p class="guest-note">Hello, {{ user.username }}!</p>
        {% endif %}

    </main>

</body>
</html>
